<svg width="400" height="320" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Live map showing a garbage truck on its way to a house" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="card">
      <rect x="0" y="0" width="400" height="320" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- map background -->
    <rect x="0" y="0" width="400" height="320" fill="#E6F5F9"/>

    <!-- park -->
    <rect x="110" y="80" width="100" height="50" rx="8" fill="#B6C949" opacity="0.45"/>
    <rect x="250" y="170" width="120" height="50" rx="8" fill="#B6C949" opacity="0.45"/>

    <!-- roads -->
    <g stroke="#FFFFFF" stroke-width="18" stroke-linecap="round">
      <line x1="0" y1="60" x2="400" y2="60"/>
      <line x1="0" y1="150" x2="400" y2="150"/>
      <line x1="90" y1="0" x2="90" y2="240"/>
      <line x1="230" y1="0" x2="230" y2="240"/>
      <line x1="345" y1="0" x2="345" y2="240"/>
    </g>

    <!-- route already driven (faded) -->
    <path d="M90 230 L90 200" stroke="#086788" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.35"/>

    <!-- route still ahead (dashed) -->
    <path d="M90 190 L90 150 L230 150 L230 60 L310 60" stroke="#086788" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 12" fill="none"/>

    <!-- house pin -->
    <g transform="translate(0 -10)">
      <path d="M310 70 L298 50 A16 16 0 1 1 322 50 Z" fill="#086788"/>
      <circle cx="310" cy="40" r="16" fill="#086788"/>
      <polygon points="310,31 301,39 319,39" fill="#FFFFFF"/>
      <rect x="303" y="39" width="14" height="10" fill="#FFFFFF"/>
      <rect x="308" y="43" width="4" height="6" fill="#086788"/>
    </g>

    <!-- truck with glow -->
    <circle cx="90" cy="195" r="26" fill="#00A878" opacity="0.2"/>
    <g transform="translate(69 183)">
      <rect x="0" y="0" width="28" height="20" rx="3" fill="#00A878"/>
      <rect x="28" y="6" width="14" height="14" rx="3" fill="#096B72"/>
      <rect x="31" y="8" width="8" height="6" rx="1" fill="#FFFFFF"/>
      <circle cx="9" cy="22" r="4" fill="#120309"/>
      <circle cx="34" cy="22" r="4" fill="#120309"/>
    </g>

    <!-- live chip -->
    <rect x="16" y="16" width="124" height="28" rx="8" fill="#FFFFFF" stroke="#086788" stroke-width="2"/>
    <circle cx="32" cy="30" r="5" fill="#00A878"/>
    <text x="44" y="35" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#120309">Live Tracking</text>

    <!-- info panel -->
    <rect x="0" y="240" width="400" height="80" fill="#FFFFFF"/>
    <rect x="0" y="240" width="400" height="4" fill="#086788"/>
    <text x="24" y="274" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#086788">Your truck is 3 stops away</text>
    <text x="24" y="298" font-family="Arial, sans-serif" font-size="14" fill="#120309">Garbage pickup, arriving around 9:45 AM</text>
  </g>

  <!-- outer border -->
  <rect x="1" y="1" width="398" height="318" rx="16" fill="none" stroke="#086788" stroke-width="2"/>
</svg>
